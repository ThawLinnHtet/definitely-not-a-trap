<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Definitely Not a Trap! A six-level pixel-art platformer.">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<title>Definitely Not a Trap!</title></head>
<body><div id="screen"><main id="game" aria-label="Definitely Not a Trap! game"><div id="stage"></div>
<div id="hud" aria-label="Game information"><div id="level" class="panel"></div><div id="coins" class="panel" hidden></div><div id="caption" class="panel" role="status" aria-live="polite"></div></div>
<div id="overlay" hidden><section class="panel" id="menu" aria-label="Game menu"></section></div>
<div id="lives-screen" hidden>
  <div class="lives-summary" role="status" aria-atomic="true"><span class="lives-hero" aria-hidden="true"></span><span id="lives-count" aria-hidden="true"></span><span id="lives-announcement" class="lives-announcement"></span></div>
</div>
<div id="touch-controls" role="group" aria-label="Touch controls" hidden>
  <div class="touch-movement">
    <button type="button" data-hold="left" aria-label="Move left"></button>
    <button type="button" data-hold="right" aria-label="Move right"></button>
  </div>
  <span id="jump-hint" class="panel" aria-hidden="true" hidden>Tap to jump</span>
  <button type="button" data-hold="jump" aria-label="Jump"></button>
  <button type="button" data-pause aria-label="Pause game"></button>
</div>
<div id="orientation-prompt" hidden>
  <section class="panel" role="status">
    <h2>Rotate your phone to play</h2>
  </section>
</div>
</main></div><script type="module" src="/src/main.ts"></script></body></html>
